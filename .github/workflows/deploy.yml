name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The web build is baked with its backend URL and Clerk key at build time
      # (Vite inlines VITE_* env vars). These live in repo config, not the code:
      #   - Variable  VITE_API_URL                 → the deployed API base URL
      #   - Secret    VITE_CLERK_PUBLISHABLE_KEY   → Clerk publishable key
      # Fail loudly if either is missing, so we never publish a frontend that
      # silently can't reach the backend or sign users in.
      - name: Check required build config
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: |
          missing=0
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Repository variable VITE_API_URL is not set (Settings → Secrets and variables → Actions → Variables). Set it to the deployed API base URL, e.g. https://urlaub-api.up.railway.app"
            missing=1
          fi
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "::error::Repository secret VITE_CLERK_PUBLISHABLE_KEY is not set (Settings → Secrets and variables → Actions → Secrets)."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

      - name: Build web app
        # build:web builds @urlaub/shared first (web imports it and resolves to
        # its built ./dist), then packages/web. The prebuild hook extracts DE
        # holidays into src/data/. Building web alone fails with
        # "Cannot find module @urlaub/shared" because shared/dist won't exist.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite (base: '/Urlaub/') emits the site here in the monorepo.
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
